<script>
let calDate = new Date();
let coords = null;

async function loadCalendar() {
  if (!coords) coords = await ISLAM_APP.getCoords();
  const month = calDate.getMonth() + 1;
  const year = calDate.getFullYear();

  document.getElementById('calGregSubtitle').textContent =
    calDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let calendarData;
  try {
    calendarData = await ISLAM_APP.fetchHijriCalendar(month, year, coords.lat, coords.lon);
  } catch (e) {
    document.getElementById('calDaysGrid').innerHTML = '<p class="col-span-7 text-center text-on-surface-variant py-lg">Could not load calendar.</p>';
    return;
  }

  // Title: hijri month(s) spanned this gregorian month
  const firstHijri = calendarData[0].hijri;
  const lastHijri = calendarData[calendarData.length - 1].hijri;
  document.getElementById('calHijriTitle').textContent =
    firstHijri.month.en === lastHijri.month.en
      ? `${firstHijri.month.en} ${firstHijri.year}`
      : `${firstHijri.month.en} - ${lastHijri.month.en} ${lastHijri.year}`;

  // First day of month weekday for grid offset (0=Sun)
  const firstDow = new Date(year, month - 1, 1).getDay();
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month - 1;

  const grid = document.getElementById('calDaysGrid');
  grid.innerHTML = '';
  for (let i = 0; i < firstDow; i++) {
    const empty = document.createElement('div');
    grid.appendChild(empty);
  }
  calendarData.forEach(dayInfo => {
    const gDay = parseInt(dayInfo.gregorian.day, 10);
    const hDay = dayInfo.hijri.day;
    const isToday = isCurrentMonth && gDay === today.getDate();
    const cell = document.createElement('div');
    cell.className = isToday
      ? 'aspect-square flex flex-col items-center justify-center rounded-xl text-on-primary bg-primary relative shadow-[0_8px_16px_rgba(78,222,163,0.2)] scale-105 z-10 cursor-pointer'
      : 'aspect-square flex flex-col items-center justify-center rounded-xl text-on-surface bg-surface-container relative hover:bg-surface-container-high transition-colors cursor-pointer active:scale-95';
    cell.title = `${dayInfo.hijri.day} ${dayInfo.hijri.month.en} ${dayInfo.hijri.year} AH`;
    cell.innerHTML = `<span class="font-body-lg text-body-lg ${isToday ? 'font-bold' : ''}">${gDay}</span>
      <span class="font-label-sm text-[10px] ${isToday ? 'text-on-primary/80' : 'text-on-surface-variant'}">${hDay}</span>`;
    grid.appendChild(cell);
  });
}

function changeMonth(delta) {
  calDate.setMonth(calDate.getMonth() + delta);
  document.getElementById('calDaysGrid').innerHTML = '<p class="col-span-7 text-center font-body-md text-on-surface-variant py-lg">Loading calendar…</p>';
  loadCalendar();
}

function goToday() {
  calDate = new Date();
  loadCalendar();
}

loadCalendar();
</script>
