<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary": "#3c2f00", "on-background": "#d4e7dd", "on-tertiary-fixed-variant": "#0b513d", "on-tertiary-fixed": "#002117", "primary-fixed-dim": "#4edea3", "on-error": "#690005", "inverse-on-surface": "#24342d", "on-secondary-container": "#342800", "on-tertiary-container": "#004231", "on-primary-fixed-variant": "#005236", "on-primary-container": "#00422b", "tertiary-fixed": "#b0f0d6", "secondary-container": "#af8d11", "tertiary": "#95d3ba", "outline": "#86948a", "primary-fixed": "#6ffbbe", "surface-container": "#13231c", "on-error-container": "#ffdad6", "outline-variant": "#3c4a42", "on-secondary-fixed": "#241a00", "tertiary-fixed-dim": "#95d3ba", "on-secondary-fixed-variant": "#574500", "surface-container-lowest": "#03110b", "surface-container-high": "#1d2d27", "secondary-fixed": "#ffe088", "background": "#071610", "surface": "#071610", "surface-tint": "#4edea3", "on-surface": "#d4e7dd", "secondary": "#e9c349", "surface-container-low": "#0f1f18", "surface-bright": "#2c3d36", "primary": "#4edea3", "error": "#ffb4ab", "secondary-fixed-dim": "#e9c349", "surface-container-highest": "#283831", "primary-container": "#10b981", "on-primary": "#003824", "inverse-primary": "#006c49", "inverse-surface": "#d4e7dd", "surface-variant": "#283831", "on-tertiary": "#003829", "surface-dim": "#071610", "on-surface-variant": "#bbcabf", "error-container": "#93000a", "on-primary-fixed": "#002113" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-desktop": "40px", "gutter": "16px", "xs": "4px", "sm": "8px", "base": "8px", "lg": "24px", "margin-mobile": "20px", "md": "16px", "xl": "32px" }, "fontFamily": { "body-md": ["Inter"], "headline-sm": ["Inter"], "display-lg": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "arabic-quran": ["Noto Serif"], "display-lg-mobile": ["Inter"] }, "fontSize": { "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "arabic-quran": ["28px", { "lineHeight": "56px", "fontWeight": "400" }], "display-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }] } } } }</script><style>@layer base { body { @apply bg-surface text-on-surface font-body-md; -webkit-tap-highlight-color: transparent; } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style><style>
    body {

  </head><body class="min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center px-margin-mobile gap-md"><button class="w-10 h-10 flex items-center justify-center hover:bg-surface-variant rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><div class="flex-1"><h1 class="font-headline-sm text-headline-sm truncate text-on-surface">Surah Details</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 pt-16 bg-surface"><div class="flex flex-col w-full relative pb-24">
<!-- Surah Header Info -->
<div class="px-margin-mobile py-lg text-center flex flex-col items-center gap-sm">
<div class="w-full flex justify-center pb-sm">
<select id="surahSelect" class="bg-surface-variant text-on-surface font-label-sm text-label-sm rounded-full px-4 py-2 border-none focus:outline-none focus:ring-2 focus:ring-primary max-w-[280px]">
<option>Loading surahs…</option>
</select>
</div>
<h2 class="font-display-lg-mobile text-on-surface" id="surahName">Loading…</h2>
<div class="flex items-center gap-2 text-on-surface-variant font-body-md opacity-80">
<span id="surahType">—</span>
<span class="w-1 h-1 rounded-full bg-secondary"></span>
<span id="surahAyahCount">— Ayahs</span>
</div>
<!-- Bismillah -->
<div class="mt-lg w-full flex justify-center pb-md border-b border-surface-variant">
<span class="font-arabic-quran text-[32px] text-on-surface">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
</div>
</div>
<!-- Ayah List -->
<div class="flex flex-col gap-xs pb-xl" id="ayahList">
<p class="text-center text-on-surface-variant py-xl">Loading ayahs…</p>
</div>
<!-- Bottom Mini Player -->
<div class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-xl border-t border-surface-variant px-margin-mobile py-sm z-40 pb-[env(safe-area-inset-bottom,16px)]">
<div class="flex items-center justify-between gap-md h-12">
<div class="flex flex-col flex-1 truncate">
<span class="font-headline-sm text-on-surface truncate text-sm" id="playerSurahName">—</span>
<span class="font-label-sm text-on-surface-variant truncate" id="playerAyahLabel">Mishary Rashid Alafasy</span>
</div>
<div class="flex items-center gap-xs">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors" onclick="playAyah(currentAyahIndex - 1)">
<span class="material-symbols-outlined">skip_previous</span>
</button>
<button class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary hover:opacity-90 transition-opacity shadow-[0_4px_12px_rgba(78,222,163,0.3)]" id="miniPlayBtn" onclick="toggleMiniPlay()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors" onclick="playAyah(currentAyahIndex + 1)">
<span class="material-symbols-outlined">skip_next</span>
</button>
</div>
</div>
<!-- Mini Progress -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-surface-variant">
<div class="h-full bg-primary rounded-r-full" id="miniProgress" style="width:0%"></div>
</div>
</div>
</div></main>
<script src="../assets/app.js"></script>
<script>
let currentSurahNumber = 18;
let currentAyahs = [];
let currentAyahIndex = -1;
const player = new Audio();

function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function populateSurahList() {
  const select = document.getElementById('surahSelect');
  try {
    const surahs = await ISLAM_APP.fetchSurahList();
    select.innerHTML = surahs.map(s =>
      `<option value="${s.number}">${s.number}. ${s.englishName} (${s.name})</option>`
    ).join('');
    select.value = currentSurahNumber;
    select.addEventListener('change', () => loadSurah(parseInt(select.value, 10)));
  } catch (e) {
    select.innerHTML = '<option>Could not load surah list</option>';
  }
}

async function loadSurah(number) {
  currentSurahNumber = number;
  document.getElementById('ayahList').innerHTML = '<p class="text-center text-on-surface-variant py-xl">Loading ayahs…</p>';
  try {
    const lang = ISLAM_APP.getLanguage();
    const translationEdition = lang === 'bn' ? 'bn.bengali' : 'en.asad';
    const reciter = ISLAM_APP.getReciter();
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${number}/editions/quran-uthmani,${translationEdition},${reciter}`);
    const json = await res.json();
    const [arabic, translation, audio] = json.data;

    document.getElementById('surahName').textContent = `Surah ${arabic.englishName}`;
    document.getElementById('surahType').textContent = arabic.revelationType;
    document.getElementById('surahAyahCount').textContent = `${arabic.numberOfAyahs} Ayahs`;
    document.getElementById('playerSurahName').textContent = `Surah ${arabic.englishName}`;

    currentAyahs = arabic.ayahs.map((a, i) => ({
      number: a.numberInSurah,
      arabic: a.text,
      bangla: translation.ayahs[i] ? translation.ayahs[i].text : '',
      audio: audio.ayahs[i] ? audio.ayahs[i].audio : ''
    }));

    const list = document.getElementById('ayahList');
    list.innerHTML = currentAyahs.map((a, i) => `
      <div class="bg-surface-container-low px-margin-mobile py-lg flex flex-col gap-md transition-all duration-300" id="ayah-card-${i}">
        <div class="flex justify-between items-start">
          <div class="w-8 h-8 rounded-full border border-secondary flex items-center justify-center relative shrink-0" id="ayah-num-${i}">
            <span class="font-body-md text-secondary">${a.number}</span>
          </div>
          <div class="flex-1 text-right pl-md">
            <p class="font-arabic-quran text-on-surface leading-[2.2]">${a.arabic}</p>
          </div>
        </div>
        <div class="mt-sm">
          <p class="font-body-md text-on-surface-variant leading-relaxed">${a.bangla}</p>
        </div>
        <div class="flex items-center justify-end gap-md pt-sm border-t border-surface-variant/50 mt-sm">
          <button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="shareAyah(${i})">
            <span class="material-symbols-outlined text-[20px]">share</span>
          </button>
          <button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-secondary transition-colors" onclick="bookmarkAyah(${i})">
            <span class="material-symbols-outlined text-[20px]">bookmark_border</span>
          </button>
          <button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="playAyah(${i})" id="ayah-play-${i}">
            <span class="material-symbols-outlined text-[20px]">play_arrow</span>
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('ayahList').innerHTML = '<p class="text-center text-on-surface-variant py-xl">Could not load this surah. Check your connection.</p>';
  }
}

function playAyah(index) {
  if (index < 0 || index >= currentAyahs.length) return;

  // remove highlight from previous ayah
  if (currentAyahIndex >= 0) {
    const prevCard = document.getElementById(`ayah-card-${currentAyahIndex}`);
    const prevNum = document.getElementById(`ayah-num-${currentAyahIndex}`);
    if (prevCard) prevCard.classList.remove('bg-primary/10', 'ring-1', 'ring-primary/40');
    if (prevNum) { prevNum.classList.remove('bg-primary', 'border-primary'); prevNum.classList.add('border-secondary'); prevNum.querySelector('span').classList.remove('text-on-primary'); prevNum.querySelector('span').classList.add('text-secondary'); }
  }

  currentAyahIndex = index;
  const a = currentAyahs[index];

  // highlight the new active ayah + scroll into view
  const card = document.getElementById(`ayah-card-${index}`);
  const num = document.getElementById(`ayah-num-${index}`);
  if (card) {
    card.classList.add('bg-primary/10', 'ring-1', 'ring-primary/40');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (num) {
    num.classList.add('bg-primary', 'border-primary');
    num.classList.remove('border-secondary');
    num.querySelector('span').classList.add('text-on-primary');
    num.querySelector('span').classList.remove('text-secondary');
  }

  document.getElementById('playerAyahLabel').textContent = `আয়াত ${a.number} / ${currentAyahs.length}`;
  if (a.audio) {
    player.src = a.audio;
    player.playbackRate = parseFloat(localStorage.getItem('islamapp_speed') || '1');
    player.play();
    document.getElementById('miniPlayBtn').innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span>';
  }
}

function toggleMiniPlay() {
  if (currentAyahIndex === -1) { playAyah(0); return; }
  if (player.paused) {
    player.play();
    document.getElementById('miniPlayBtn').innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span>';
  } else {
    player.pause();
    document.getElementById('miniPlayBtn').innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span>';
  }
}

player.addEventListener('timeupdate', () => {
  if (player.duration) {
    document.getElementById('miniProgress').style.width = `${(player.currentTime / player.duration) * 100}%`;
  }
});
player.addEventListener('ended', () => playAyah(currentAyahIndex + 1));

function shareAyah(index) {
  const a = currentAyahs[index];
  const text = `${a.arabic}\n\n${a.bangla}`;
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text);
    alert('Ayah copied to clipboard');
  }
}

function bookmarkAyah(index) {
  const a = currentAyahs[index];
  const bookmarks = JSON.parse(localStorage.getItem('islamapp_bookmarks') || '[]');
  bookmarks.push({ surah: currentSurahNumber, ayah: a.number, date: new Date().toISOString() });
  localStorage.setItem('islamapp_bookmarks', JSON.stringify(bookmarks));
  alert(`Bookmarked Ayah ${a.number}`);
}

(function initReader() {
  const qSurah = parseInt(getQueryParam('surah'), 10);
  if (qSurah) currentSurahNumber = qSurah;
  populateSurahList();
  loadSurah(currentSurahNumber);
})();
</script>
</body></html>
