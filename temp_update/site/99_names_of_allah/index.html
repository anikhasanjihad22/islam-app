  </head><body class="min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 flex items-center justify-between px-margin-mobile"><div class="flex items-center gap-sm"><img alt="Islam App Icon" class="h-8 w-auto object-contain" src="../assets/logo.svg"/><span class="font-headline-md text-headline-md tracking-tight bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent font-bold">Islam</span></div><div class="flex items-center gap-md"><span class="font-headline-sm text-headline-sm text-on-surface-variant px-md">More</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-lg"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 pt-16 pb-24 bg-surface px-margin-mobile"><div class="flex flex-col w-full gap-lg">
<div class="px-margin-mobile pt-sm">
<div class="relative bg-surface-container rounded-full overflow-hidden shadow-sm flex items-center h-12">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant z-10 pointer-events-none">search</span>
<input aria-label="Search 99 Names" class="w-full bg-transparent border-none focus:ring-0 text-body-md pl-12 pr-4 text-on-surface placeholder-on-surface-variant h-full focus:outline-none" id="nameSearch" placeholder="Search names..." type="text"/>
</div>
</div>
<div class="px-margin-mobile grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-md pb-xl" id="namesGrid">
<p class="col-span-2 font-body-md text-on-surface-variant text-center py-lg">Loading the 99 Names…</p>
</div>
</div>
<script src="../assets/app.js"></script>
<script>
let ALL_NAMES = [];

function renderNames(names) {
  const grid = document.getElementById('namesGrid');
  if (!names.length) {
    grid.innerHTML = '<p class="col-span-2 font-body-md text-on-surface-variant text-center py-lg">No names match your search.</p>';
    return;
  }
  grid.innerHTML = names.map((n, i) => `
    <div class="name-card islamapp-pop bg-surface-container rounded-xl p-md flex flex-col items-center text-center shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow duration-300 cursor-pointer" onclick="openNameModal(${n.number - 1})" style="animation-delay:${Math.min(i * 20, 400)}ms">
      <div class="absolute -top-6 -right-6 w-24 h-24 bg-primary/5 rounded-full blur-xl group-hover:bg-primary/10 transition-colors duration-500"></div>
      <span class="font-label-sm text-secondary mb-2 tracking-wider">${String(n.number).padStart(2, '0')}</span>
      <h3 class="font-arabic-quran text-arabic-quran text-secondary mb-1">${n.name}</h3>
      <p class="font-headline-sm text-[16px] text-on-surface leading-tight mb-1">${n.transliteration}</p>
      <p class="font-body-md text-sm text-on-surface-variant">${n.en.meaning}</p>
    </div>
  `).join('');
}

function openNameModal(index) {
  const n = ALL_NAMES[index];
  if (!n) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-6 islamapp-modal-backdrop';
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  backdrop.innerHTML = `
    <div class="islamapp-pop bg-surface-container-high rounded-3xl p-xl max-w-sm w-full flex flex-col items-center text-center gap-md shadow-2xl border border-primary/20 relative">
      <button class="absolute top-3 right-3 w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant" onclick="this.closest('.fixed').remove()">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
      <span class="font-label-sm text-secondary tracking-widest">${String(n.number).padStart(2, '0')} / 99</span>
      <h2 class="font-arabic-quran text-[56px] leading-tight text-secondary">${n.name}</h2>
      <h3 class="font-headline-md text-headline-md text-on-surface">${n.transliteration}</h3>
      <p class="font-body-lg text-body-lg text-on-surface-variant">${n.en.meaning}</p>
      <div class="w-16 h-px bg-primary/30 my-sm"></div>
      <p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">Reflect on this name of Allah throughout your day</p>
    </div>
  `;
  document.body.appendChild(backdrop);
}

(async function init99Names() {
  try {
    ALL_NAMES = await ISLAM_APP.fetch99Names();
    renderNames(ALL_NAMES);
  } catch (e) {
    document.getElementById('namesGrid').innerHTML = '<p class="col-span-2 font-body-md text-on-surface-variant text-center py-lg">Could not load names. Check your connection.</p>';
  }

  document.getElementById('nameSearch').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = ALL_NAMES.filter(n =>
      n.transliteration.toLowerCase().includes(term) ||
      n.en.meaning.toLowerCase().includes(term)
    );
    renderNames(filtered);
  });
})();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl" data-active-classes="text-secondary nav-active"><div class="h-20 flex justify-between items-center px-4"><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="home" href="../home_dashboard/"><span class="material-symbols-outlined">home</span><span class="font-label-sm text-label-sm"><span data-i18n="home">Home</span></span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="quran" href="../quran_reader/"><span class="material-symbols-outlined">menu_book</span><span class="font-label-sm text-label-sm"><span data-i18n="quran">Quran</span></span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="duas" href="../duas_library/"><span class="material-symbols-outlined">folded_hands</span><span class="font-label-sm text-label-sm"><span data-i18n="duas">Duas</span></span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="prayer" href="../prayer_times/"><span class="material-symbols-outlined">schedule</span><span class="font-label-sm text-label-sm"><span data-i18n="prayer">Prayer</span></span></a><a aria-current="page" class="flex flex-col items-center justify-center flex-1 gap-xs transition-colors text-secondary nav-active" data-path="more" href="../settings/"><span class="material-symbols-outlined">more_horiz</span><span class="font-label-sm text-label-sm"><span data-i18n="more">More</span></span></a></div><div class="absolute bottom-safe left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-secondary hidden active-dot"></div></nav></body></html>
