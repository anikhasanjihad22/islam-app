  { collection: 'সুনানে আন-নাসাঈ', book: 'তাহারাত (পবিত্রতা)', arabic: 'مِفْتَاحُ الْجَنَّةِ الصَّلاَةُ وَمِفْتَاحُ الصَّلاَةِ الطُّهُورُ', bangla: 'জান্নাতের চাবি নামাজ, আর নামাজের চাবি পবিত্রতা।', narrator: 'জাবির ইবনে আবদুল্লাহ (রাঃ)' },
  { collection: 'সুনানে আন-নাসাঈ', book: 'জানাযা', arabic: 'حُسْنُ الظَّنِّ بِاللَّهِ مِنْ حُسْنِ عِبَادَتِهِ', bangla: 'আল্লাহর প্রতি সুধারণা রাখা তাঁর উত্তম ইবাদতের অংশ।', narrator: 'আবু হুরায়রা (রাঃ)' },
  { collection: 'সুনানে আন-নাসাঈ', book: 'ঈমান', arabic: 'لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثِ لَيَالٍ', bangla: 'কোনো মুসলিমের জন্য তার ভাইয়ের সাথে তিন দিনের বেশি সম্পর্ক ছিন্ন রাখা বৈধ নয়।', narrator: 'আবু আইয়ুব আল-আনসারী (রাঃ)' },

  { collection: 'সুনানে ইবনে মাজাহ', book: 'ইলম', arabic: 'طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ', bangla: 'জ্ঞান অর্জন করা প্রত্যেক মুসলিমের উপর ফরজ।', narrator: 'আনাস ইবনে মালিক (রাঃ)' },
  { collection: 'সুনানে ইবনে মাজাহ', book: 'যুহদ (আত্মসংযম)', arabic: 'الدُّنْيَا مَتَاعٌ وَخَيْرُ مَتَاعِ الدُّنْيَا الْمَرْأَةُ الصَّالِحَةُ', bangla: 'দুনিয়া একটি ভোগসামগ্রী, আর দুনিয়ার সর্বোত্তম সামগ্রী হলো নেককার স্ত্রী।', narrator: 'আবদুল্লাহ ইবনে আমর (রাঃ)' },
  { collection: 'সুনানে ইবনে মাজাহ', book: 'আদব (শিষ্টাচার)', arabic: 'الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَٰنُ', bangla: 'যারা দয়াশীল, দয়াময় আল্লাহ তাদের প্রতি দয়া করেন।', narrator: 'আবদুল্লাহ ইবনে আমর (রাঃ)' },
];

const HADITH_COLLECTIONS_ORDER = ['সহীহ বুখারী', 'সহীহ মুসলিম', 'সুনানে আবু দাউদ', 'জামে তিরমিযী', 'সুনানে আন-নাসাঈ', 'সুনানে ইবনে মাজাহ'];

function renderHadiths(list) {
  const container = document.getElementById('hadithList');
  container.innerHTML = list.map(h => `
    <div class="bg-surface-container rounded-[16px] p-md border border-white/5 shadow-sm flex flex-col gap-sm islamapp-pop">
      <div class="flex items-center justify-between flex-wrap gap-xs">
        <span class="font-label-sm text-label-sm text-secondary bg-secondary/10 px-2 py-0.5 rounded-full">${h.collection}</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">${h.book}</span>
      </div>
      <p class="font-arabic-quran text-arabic-quran text-primary text-right leading-loose" dir="rtl">${h.arabic}</p>
      <p class="font-body-md text-body-md text-on-surface-variant">${h.bangla}</p>
      <p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">বর্ণনাকারী: ${h.narrator}</p>
    </div>
  `).join('') || '<p class="font-body-md text-on-surface-variant text-center py-lg">কোনো হাদিস পাওয়া যায়নি।</p>';
}

function renderFilters() {
  const collections = ['সব', ...HADITH_COLLECTIONS_ORDER];
  const wrap = document.getElementById('collectionFilters');
  wrap.innerHTML = collections.map((c, i) => `
    <button class="flex-none px-md py-2 rounded-full font-label-sm text-label-sm transition-colors ${i === 0 ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant'}" data-filter="${c}" onclick="filterByCollection('${c}', this)">${c}</button>
  `).join('');
}

function filterByCollection(c, btn) {
  document.querySelectorAll('#collectionFilters button').forEach(b => {
    b.classList.remove('bg-primary', 'text-on-primary');
    b.classList.add('bg-surface-container', 'text-on-surface-variant');
  });
  btn.classList.add('bg-primary', 'text-on-primary');
  btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
  renderHadiths(c === 'সব' ? HADITHS : HADITHS.filter(h => h.collection === c));
}

document.getElementById('hadithSearch').addEventListener('input', (e) => {
  const term = e.target.value.trim().toLowerCase();
  if (!term) { renderHadiths(HADITHS); return; }
  renderHadiths(HADITHS.filter(h =>
    h.bangla.toLowerCase().includes(term) ||
    h.book.toLowerCase().includes(term) ||
    h.collection.toLowerCase().includes(term)
  ));
});

renderFilters();
renderHadiths(HADITHS);
</script>
</body></html>
